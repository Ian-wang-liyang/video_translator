[paths]
videos = "videos"
runtime = ".subtitle-tools"

[backend]
# auto selects MLX/Metal on Apple Silicon. Elsewhere it selects faster-whisper
# and llama.cpp, using CUDA when an NVIDIA GPU is detected and CPU otherwise.
transcription = "auto"
translation = "auto"
device = "auto"

[processing]
chunk_seconds = 300

[models]
# Values are paths relative to <runtime>/models. Leave absent to use defaults.
# whisper = "whisper-large-v3-turbo"
# translation = "qwen3-4b-instruct-4bit"
