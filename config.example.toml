[paths]
# May be repository-relative or an absolute path. Subtitle sidecars are written
# beside the source videos, so the directory must be writable for processing.
videos = "videos"
runtime = ".subtitle-tools"

[backend]
# auto selects MLX/Metal on Apple Silicon. Linux/WSL and Windows select
# faster-whisper and llama.cpp, using CUDA when a compatible NVIDIA driver is
# detected and CPU otherwise.
transcription = "auto"
translation = "auto"
device = "auto"

[processing]
chunk_seconds = 300

[models]
# Values are paths relative to <runtime>/models. Leave absent to use defaults.
# whisper = "whisper-large-v3-turbo"
# translation = "qwen3-4b-instruct-4bit"
