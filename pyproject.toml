[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-pipeline-local"
version = "0.1.0"
description = "Offline Japanese transcription and Simplified Chinese subtitle generation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = ["subtitles", "speech-recognition", "translation", "japanese", "simplified-chinese"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]
dependencies = ["huggingface-hub>=0.27,<2"]

[project.urls]
Repository = "https://github.com/Ian-wang-liyang/video_translator"
Issues = "https://github.com/Ian-wang-liyang/video_translator/issues"
Changelog = "https://github.com/Ian-wang-liyang/video_translator/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mac = ["mlx==0.32.0", "mlx-metal==0.32.0", "mlx-whisper==0.4.3", "mlx-lm==0.31.3"]
windows = ["faster-whisper==1.2.1", "llama-cpp-python==0.3.23"]
linux = ["faster-whisper==1.2.1", "llama-cpp-python==0.3.23"]
cuda = [
    "faster-whisper==1.2.1",
    "nvidia-cublas-cu12==12.9.2.10; platform_system == 'Windows'",
    "nvidia-cuda-runtime-cu12==12.9.79; platform_system == 'Windows'",
]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
subtitle-pipeline = "subtitle_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
